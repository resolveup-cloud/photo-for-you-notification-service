name: Build de artefato (sob demanda)
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: build-artifact-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Construir uma vez e exportar imagem OCI
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
      with:
        context: .
        file: Dockerfile
        push: false
        platforms: linux/amd64
        outputs: type=oci,dest=${{ runner.temp }}/image.tar
        tags: resolveup-build/photo-for-you-notification-service:sha-${{ github.sha }}
        labels: org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=build-artifact-image
        cache-to: type=gha,mode=min,scope=build-artifact-image
    - name: Checksum do artefato
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        sha256sum image.tar > image.tar.sha256
    - name: Guardar artefato por 3 dias
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: photo-for-you-notification-service-image-oci-${{ github.sha }}-${{ github.run_attempt }}
        path: |-
          ${{ runner.temp }}/image.tar
          ${{ runner.temp }}/image.tar.sha256
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
